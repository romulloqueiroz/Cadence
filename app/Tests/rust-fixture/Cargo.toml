[package]
name = "cadence-test-plugin"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
clap-sys = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSView", "NSWindow", "NSResponder"] }
