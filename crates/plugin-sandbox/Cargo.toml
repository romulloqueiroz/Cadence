[package]
name = "plugin-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Out-of-process plugin supervisor: shared-memory audio + worker protocol"

[dependencies]
plugin-api = { path = "../plugin-api" }
plugin-loader = { path = "../plugin-loader" }
adapter-clap = { path = "../adapter-clap" }
adapter-au = { path = "../adapter-au" }
host = { path = "../host" }
libc = "0.2"
sample-adapter = { path = "../sample-adapter" }
plugin-package = { path = "../plugin-package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
clap-sys = "0.5"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSWindow", "NSView", "NSResponder", "NSGraphics", "NSControl", "NSRunningApplication"] }

[dev-dependencies]
ed25519-dalek = "2"
flate2 = "1"

[[bin]]
name = "plugin-worker"
path = "src/bin/plugin-worker.rs"

[[bin]]
name = "sandbox-host"
path = "src/bin/sandbox-host.rs"

[[test]]
name = "clap_main_thread"
path = "tests/clap_main_thread.rs"
harness = false
